<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ConvertPDFtoWord.pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { mono: ['Roboto Mono', 'monospace'] }, colors: { darkbg: '#121212', darkcard: '#1e1e1e', primary: '#3b82f6' } } }
        }
    </script>
    <style>body { font-family: 'Roboto Mono', monospace; }</style>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen flex flex-col">

    <header class="bg-darkcard border-b border-gray-800 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white"><a href="/">ConvertPDFtoWord<span class="text-primary">.pro</span></a></h1>
            <nav class="hidden md:flex space-x-6">
                <a href="/" class="hover:text-primary transition">Home</a>
                <a href="/privacy-policy.html" class="hover:text-primary transition">Privacy Policy</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-2xl mx-auto px-4 py-12 w-full">
        <div class="bg-darkcard p-8 rounded-xl shadow-lg border border-gray-800 text-center">
            <h1 class="text-3xl font-bold text-white mb-4">Contact Us</h1>
            <p class="text-gray-400 mb-8">Have a question, feedback, or need help with a conversion? We'd love to hear from you.</p>
            
            <div class="text-left space-y-4">
                <div>
                    <label class="block text-gray-400 text-sm font-bold mb-2">Name</label>
                    <input type="text" class="w-full bg-darkbg border border-gray-700 text-white rounded py-3 px-4 focus:outline-none focus:border-primary" placeholder="Your Name">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm font-bold mb-2">Email</label>
                    <input type="email" class="w-full bg-darkbg border border-gray-700 text-white rounded py-3 px-4 focus:outline-none focus:border-primary" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm font-bold mb-2">Message</label>
                    <textarea class="w-full bg-darkbg border border-gray-700 text-white rounded py-3 px-4 h-32 focus:outline-none focus:border-primary" placeholder="How can we help you?"></textarea>
                </div>
                <button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded transition mt-4">
                    Send Message
                </button>
            </div>
            
            <div class="mt-8 pt-8 border-t border-gray-800">
                <p class="text-gray-400">Or email us directly at: <a href="mailto:support@convertpdftoword.pro" class="text-primary hover:underline">support@convertpdftoword.pro</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-darkcard border-t border-gray-800 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-gray-500 text-sm">
            <div class="flex justify-center space-x-6 mb-4">
                <a href="/privacy-policy.html" class="hover:text-white transition">Privacy Policy</a>
                <a href="/contact.html" class="hover:text-white transition">Contact Us</a>
            </div>
            <p>&copy; 2026 ConvertPDFtoWord.pro. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
